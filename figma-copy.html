<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Копирование SVG для Figma</title><style>body{font-family:Arial;margin:30px}button{display:block;margin:6px 0;padding:10px 14px;font-size:15px;width:420px;text-align:left;cursor:pointer}#st{margin-top:14px;font-weight:bold}</style></head><body><h1>SVG для Figma</h1><div id="b"></div><div id="st">Загрузка...</div><script>
const ITEMS=[["01", "01 Главная"], ["02", "02 Каталог"], ["03", "03 Каталог, фильтры открыты"], ["04", "04 Карточка модели"], ["05", "05 Конструктор"], ["06", "06 Персонализация"], ["07", "07 Проверка зрения"], ["08", "08 О бренде"], ["09", "09 Ателье и контакты"], ["10", "10 Обслуживание и гарантия"], ["11", "11 Документы"], ["12", "12 Запись, шаг 1"], ["13", "13 Запись, шаг 2"], ["14", "14 Запись, шаг 3"], ["15", "15 Личный кабинет, вход"], ["16", "16 Личный кабинет, обзор"], ["17", "17 Страница 404"]];const T={};
Promise.all(ITEMS.map(([n])=>fetch('figma/'+n+'.svg?'+Date.now()).then(r=>r.text()).then(t=>T[n]=t))).then(()=>st.textContent='Готово к копированию');
b.innerHTML=ITEMS.map(([n,t])=>'<button id="c'+n+'" data-n="'+n+'">'+t+'</button>').join('');
b.onclick=e=>{const n=e.target.dataset.n;if(!n)return;navigator.clipboard.writeText(T[n]).then(()=>{st.textContent='Скопировано: '+n+' ('+T[n].length+' символов)';e.target.style.background='#cfc'},err=>st.textContent='Ошибка: '+err)};
</script></body></html>
