<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1643" viewBox="0 0 1440 1643"><rect width="1440" height="1643" fill="#ffffff"/><g id="body"><rect x="0.0" y="0.0" width="1440.0" height="1642.9" fill="#ffffff"/><g id="header"><rect x="0.0" y="0.0" width="1440.0" height="94.0" fill="#ffffff" fill-opacity="0.96"/><line x1="0.0" y1="93.5" x2="1440.0" y2="93.5" stroke="#dedede" stroke-width="1"/><g id="logo"><text x="57.6" y="48.8" font-family="Arial" font-size="34" font-weight="bold" letter-spacing="-2" fill="#111111" xml:space="preserve">swissflex</text><text x="57.6" y="71.5" font-family="Arial" font-size="11" font-weight="normal" fill="#111111" xml:space="preserve">Москва</text></g><g id="nav"><text x="629.9" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Каталог</text><text x="701.2" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Конструктор</text><text x="799.3" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Проверка зрения</text><text x="927.1" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Персонализация</text><text x="1053.0" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">О бренде</text><text x="1134.6" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Ателье</text><text x="1201.2" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Кабинет</text></g><g id="button"><rect x="1280.6" y="26.4" width="101.8" height="40.2" fill="#111111"/><rect x="1281.1" y="26.9" width="100.8" height="39.2" fill="none" stroke="#111111" stroke-width="1"/><text x="1299.6" y="50.8" font-family="Arial" font-size="12" font-weight="normal" fill="#ffffff" xml:space="preserve">Записаться</text></g></g><g id="app"><g id="container"><text x="86.4" y="155.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">Главная</text><text x="147.1" y="155.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">/</text><text x="165.4" y="155.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">Обслуживание очков Swissflex</text><text x="86.4" y="244.5" font-family="Arial" font-size="60.48" font-weight="normal" letter-spacing="-2" fill="#111111" xml:space="preserve">Обслуживание очков Swissflex</text><text x="86.4" y="297.6" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">С вопросами о посадке, деталях и линзах обращайтесь в московское ателье.</text></g><g id="container"><line x1="86.4" y1="360.6" x2="1353.6" y2="360.6" stroke="#dddddd" stroke-width="1"/><text x="86.4" y="460.8" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">Замена детали</text><text x="608.2" y="438.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Принесите очки Swissflex на осмотр. Мастер проверит конструкцию и определит, какие</text><text x="608.2" y="463.2" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">детали можно заменить.</text><text x="608.2" y="508.0" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Условия бесплатной замены зависят от причины обращения и гарантии. Их уточним по</text><text x="608.2" y="532.8" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">результатам осмотра.</text><line x1="86.4" y1="620.8" x2="1353.6" y2="620.8" stroke="#dddddd" stroke-width="1"/><text x="86.4" y="721.0" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">Новая оправа</text><text x="86.4" y="769.3" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">со знакомыми линзами</text><text x="608.2" y="698.6" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Для безободковой пары можно рассмотреть перенос линз в новую оправу. Возможность</text><text x="608.2" y="723.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">переноса зависит от формы линз, состояния и креплений.</text><text x="608.2" y="768.2" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Сначала осмотрим очки, затем предложим совместимые варианты и назовём стоимость.</text><line x1="86.4" y1="866.5" x2="1353.6" y2="866.5" stroke="#dddddd" stroke-width="1"/><text x="86.4" y="966.7" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">Гарантия на оправу и</text><text x="86.4" y="1015.1" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">линзы</text><text x="608.2" y="944.3" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">У оправ и линз отдельные гарантийные условия. Гарантия на линзы зависит от их</text><text x="608.2" y="969.1" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">производителя.</text><rect x="608.2" y="996.6" width="670.0" height="40.1" fill="#f5f5f5"/><line x1="609.2" y1="996.6" x2="609.2" y2="1036.8" stroke="#999999" stroke-width="2"/><text x="625.2" y="1020.8" font-family="Arial" font-size="13" font-weight="normal" fill="#555555" xml:space="preserve">Сроки, покрытие и порядок обращения добавим после получения гарантийных условий от ателье.</text></g><g id="cta"><line x1="0.0" y1="1117.3" x2="1440.0" y2="1117.3" stroke="#cccccc" stroke-width="1"/><line x1="0.0" y1="1344.2" x2="1440.0" y2="1344.2" stroke="#cccccc" stroke-width="1"/><text x="86.4" y="1212.4" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">Примерьте Swissflex в ателье</text><text x="86.4" y="1256.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Подберём посадку, покажем цвета и обсудим линзы. Зрение можно</text><text x="86.4" y="1281.2" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">проверить на том же визите, бесплатно.</text><rect x="1155.7" y="1205.3" width="197.9" height="50.9" fill="#111111"/><rect x="1156.2" y="1205.8" width="196.9" height="49.9" fill="none" stroke="#111111" stroke-width="1"/><text x="1180.7" y="1235.4" font-family="Arial" font-size="14" font-weight="normal" fill="#ffffff" xml:space="preserve">Выбрать время визита</text></g></g><g id="footer"><rect x="0.0" y="1344.7" width="1440.0" height="298.1" fill="#f3f3f3"/><g id="footer-top"><text x="86.4" y="1434.1" font-family="Arial" font-size="34" font-weight="bold" letter-spacing="-2" fill="#111111" xml:space="preserve">swissflex</text><text x="86.4" y="1456.7" font-family="Arial" font-size="11" font-weight="normal" fill="#111111" xml:space="preserve">Москва</text><text x="564.1" y="1421.7" font-family="Arial" font-size="15" font-weight="normal" fill="#555555" xml:space="preserve">Швейцарские очки.</text><text x="564.1" y="1444.9" font-family="Arial" font-size="15" font-weight="normal" fill="#555555" xml:space="preserve">Индивидуальный подбор в Москве.</text><rect x="1155.7" y="1404.7" width="197.9" height="50.9" fill="#111111"/><rect x="1156.2" y="1405.2" width="196.9" height="49.9" fill="none" stroke="#111111" stroke-width="1"/><text x="1180.7" y="1434.8" font-family="Arial" font-size="14" font-weight="normal" fill="#ffffff" xml:space="preserve">Выбрать время визита</text></g><g id="footer-links"><text x="86.4" y="1529.6" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Каталог</text><line x1="86.4" y1="1532.6" x2="130.0" y2="1532.6" stroke="#111111" stroke-width="1"/><text x="153.0" y="1529.6" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Проверка зрения</text><line x1="153.0" y1="1532.6" x2="248.8" y2="1532.6" stroke="#111111" stroke-width="1"/><text x="271.8" y="1529.6" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Персонализация</text><line x1="271.8" y1="1532.6" x2="365.8" y2="1532.6" stroke="#111111" stroke-width="1"/><text x="388.8" y="1529.6" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Конструктор</text><line x1="388.8" y1="1532.6" x2="457.3" y2="1532.6" stroke="#111111" stroke-width="1"/><text x="480.3" y="1529.6" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">О бренде и материале</text><line x1="480.3" y1="1532.6" x2="607.2" y2="1532.6" stroke="#111111" stroke-width="1"/><text x="630.2" y="1529.6" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Ателье и контакты</text><line x1="630.2" y1="1532.6" x2="733.1" y2="1532.6" stroke="#111111" stroke-width="1"/><text x="756.1" y="1529.6" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Обслуживание и гарантия</text><line x1="756.1" y1="1532.6" x2="901.8" y2="1532.6" stroke="#111111" stroke-width="1"/><text x="924.8" y="1529.6" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Документы</text><line x1="924.8" y1="1532.6" x2="986.7" y2="1532.6" stroke="#111111" stroke-width="1"/><text x="1009.7" y="1529.6" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Личный кабинет</text><line x1="1009.7" y1="1532.6" x2="1100.0" y2="1532.6" stroke="#111111" stroke-width="1"/></g><g id="fineprint"><line x1="86.4" y1="1580.3" x2="1353.6" y2="1580.3" stroke="#cccccc" stroke-width="1"/><text x="86.4" y="1612.8" font-family="Arial" font-size="11" font-weight="normal" fill="#777777" xml:space="preserve">Swissflex Москва, 2026. Официальный дистрибьютор Swissflex.</text><text x="1102.8" y="1612.8" font-family="Arial" font-size="11" font-weight="normal" fill="#777777" xml:space="preserve">Прототип для согласования структуры и текстов.</text></g></g></g></svg>