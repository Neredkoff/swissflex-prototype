<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="992" viewBox="0 0 1440 992"><rect width="1440" height="992" fill="#ffffff"/><g id="body"><rect x="0.0" y="0.0" width="1440.0" height="992.5" fill="#ffffff"/><g id="header"><rect x="0.0" y="0.0" width="1440.0" height="94.0" fill="#ffffff" fill-opacity="0.96"/><line x1="0.0" y1="93.5" x2="1440.0" y2="93.5" stroke="#dedede" stroke-width="1"/><g id="logo"><text x="57.6" y="48.8" font-family="Arial" font-size="34" font-weight="bold" letter-spacing="-2" fill="#111111" xml:space="preserve">swissflex</text><text x="57.6" y="71.5" font-family="Arial" font-size="11" font-weight="normal" fill="#111111" xml:space="preserve">Москва</text></g><g id="nav"><text x="629.9" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Каталог</text><text x="701.2" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Конструктор</text><text x="799.3" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Проверка зрения</text><text x="927.1" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Персонализация</text><text x="1053.0" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">О бренде</text><text x="1134.6" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Ателье</text><text x="1201.2" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Кабинет</text><line x1="1201.2" y1="53.6" x2="1250.6" y2="53.6" stroke="#111111" stroke-width="1"/></g><g id="button"><rect x="1280.6" y="26.4" width="101.8" height="40.2" fill="#111111"/><rect x="1281.1" y="26.9" width="100.8" height="39.2" fill="none" stroke="#111111" stroke-width="1"/><text x="1299.6" y="50.8" font-family="Arial" font-size="12" font-weight="normal" fill="#ffffff" xml:space="preserve">Записаться</text></g></g><g id="container"><text x="86.4" y="177.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">Главная</text><text x="147.1" y="177.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">/</text><text x="165.4" y="177.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">Личный кабинет</text><text x="86.4" y="256.4" font-family="Arial" font-size="49" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">Личный кабинет</text><text x="86.4" y="308.8" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Здесь видно ближайший визит, статус заказа и рецепт</text><text x="86.4" y="333.6" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">после проверки зрения. Сохранённые сборки из</text><text x="86.4" y="358.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">конструктора тоже хранятся здесь.</text><circle cx="93.4" cy="398.3" r="2.5" fill="#555555"/><text x="104.4" y="403.2" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Перенести или отменить визит</text><circle cx="93.4" cy="431.1" r="2.5" fill="#555555"/><text x="104.4" y="436.0" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Узнать, когда очки будут готовы</text><circle cx="93.4" cy="463.9" r="2.5" fill="#555555"/><text x="104.4" y="468.8" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Посмотреть рецепт и дату проверки</text><circle cx="93.4" cy="496.7" r="2.5" fill="#555555"/><text x="104.4" y="501.6" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Записаться на обслуживание по гарантии</text><rect x="86.4" y="534.1" width="430.0" height="60.3" fill="#f5f5f5"/><line x1="87.4" y1="534.1" x2="87.4" y2="594.3" stroke="#999999" stroke-width="2"/><text x="103.4" y="558.3" font-family="Arial" font-size="13" font-weight="normal" fill="#555555" xml:space="preserve">Демонстрационный вход. Подойдёт любой номер и любые</text><text x="103.4" y="578.4" font-family="Arial" font-size="13" font-weight="normal" fill="#555555" xml:space="preserve">четыре цифры кода.</text><rect x="724.4" y="164.5" width="628.7" height="429.3" fill="none" stroke="#cccccc" stroke-width="1"/><text x="759.9" y="223.4" font-family="Arial" font-size="26" font-weight="normal" letter-spacing="-0.5" fill="#111111" xml:space="preserve">Вход по номеру телефона</text><text x="759.9" y="274.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Используйте номер, который вы оставляли при записи или покупке.</text><text x="759.9" y="316.1" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Номер телефона</text><rect x="759.9" y="330.0" width="557.7" height="47.7" fill="#ffffff"/><rect x="760.4" y="330.5" width="556.7" height="46.7" fill="none" stroke="#cccccc" stroke-width="1"/><text x="771.9" y="358.8" font-family="Arial" font-size="14" fill="#888888">+7 900 000 00 00</text><rect x="759.9" y="397.7" width="137.4" height="50.9" fill="#111111"/><rect x="760.4" y="398.2" width="136.4" height="49.9" fill="none" stroke="#111111" stroke-width="1"/><text x="784.9" y="427.8" font-family="Arial" font-size="14" font-weight="normal" fill="#ffffff" xml:space="preserve">Получить код</text><text x="759.9" y="477.0" font-family="Arial" font-size="12" font-weight="normal" fill="#555555" xml:space="preserve">Кабинет создаётся автоматически после первой записи в ателье.</text></g><g id="footer"><rect x="0.0" y="694.3" width="1440.0" height="298.1" fill="#f3f3f3"/><g id="footer-top"><text x="86.4" y="783.7" font-fa