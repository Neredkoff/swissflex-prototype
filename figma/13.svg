ve">Записаться</text></g></g><g id="container"><text x="86.4" y="177.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">Главная</text><text x="147.1" y="177.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">/</text><text x="165.4" y="177.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">Запись</text><text x="86.4" y="256.4" font-family="Arial" font-size="49" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">Запись в ателье</text><text x="86.4" y="308.8" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Подберём оправу и проверим зрение за один визит.</text><text x="86.4" y="333.6" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Проверка бесплатная.</text><text x="86.4" y="378.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Отложите оправы в</text><text x="236.9" y="378.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">каталоге</text><line x1="236.9" y1="381.4" x2="301.7" y2="381.4" stroke="#555555" stroke-width="1"/><text x="301.7" y="378.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">, и консультант подготовит</text><text x="86.4" y="403.2" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">их к визиту.</text><rect x="86.4" y="430.7" width="430.0" height="60.3" fill="#f5f5f5"/><line x1="87.4" y1="430.7" x2="87.4" y2="491.0" stroke="#999999" stroke-width="2"/><text x="103.4" y="454.9" font-family="Arial" font-size="13" font-weight="normal" fill="#555555" xml:space="preserve">Демонстрационный сценарий. После подключения YCLIENTS</text><text x="103.4" y="475.0" font-family="Arial" font-size="13" font-weight="normal" fill="#555555" xml:space="preserve">здесь будет реальное расписание ателье.</text><rect x="724.4" y="164.5" width="628.7" height="643.2" fill="none" stroke="#cccccc" stroke-width="1"/><text x="759.9" y="213.4" font-family="Arial" font-size="12" font-weight="normal" fill="#777777" xml:space="preserve">1. Услуга и время</text><text x="877.7" y="213.4" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">2. Контакты</text><line x1="877.7" y1="216.4" x2="942.9" y2="216.4" stroke="#111111" stroke-width="1"/><text x="962.9" y="213.4" font-family="Arial" font-size="12" font-weight="normal" fill="#777777" xml:space="preserve">3. Подтверждение</text><text x="759.9" y="272.0" font-family="Arial" font-size="26" font-weight="normal" letter-spacing="-0.5" fill="#111111" xml:space="preserve">Контакты для записи</text><text x="759.9" y="323.0" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Проверка зрения для взрослых</text><text x="759.9" y="347.8" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">ср, 11 нояб., 13:00</text><text x="759.9" y="389.5" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Ваше имя</text><rect x="759.9" y="403.4" width="557.7" height="47.7" fill="#ffffff"/><rect x="760.4" y="403.9" width="556.7" height="46.7" fill="none" stroke="#cccccc" stroke-width="1"/><text x="771.9" y="432.2" font-family="Arial" font-size="14" fill="#888888">Как к вам обращаться</text><text x="759.9" y="485.3" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Номер телефона</text><rect x="759.9" y="499.3" width="557.7" height="47.7" fill="#ffffff"/><rect x="760.4" y="499.8" width="556.7" height="46.7" fill="none" stroke="#cccccc" stroke-width="1"/><text x="771.9" y="528.0" font-family="Arial" font-size="14" fill="#888888">+7 900 000 00 00</text><rect x="763.9" y="570.0" width="13.1" height="16.0" fill="#ffffff"/><rect x="763.9" y="570.0" width="13.1" height="16.0" fill="#ffffff" stroke="#111111"/><text x="790.0" y="580.3" font-family="Arial" font-size="12" font-weight="normal" fill="#555555" xml:space="preserve">Я понимаю, что это демонстрация записи. Для реальной записи будет действовать</text><text x="1260.0" y="580.3" font-family="Arial" font-size="12" font-weight="normal" fill="#555555" xml:space="preserve">согласие</text><line x1="1260.0" y1="583.3" x2="1310.0" y2="583.3" stroke="#555555" stroke-width="1"/><text x="790.0" y="598.9" font-family="Arial" font-size="12" font-weight="normal" fill="#555555" xml:space="preserve">на обработку данных</text><line x1="790.0" y1="601.9" x2="908.6" y2="601.9" stroke="#555555" stroke-width="1"/><text x="908.6" y="598.9" font-family="Arial" font-size="12" font-weight="normal" fill="#555555" xml:space="preserve">.</text><rect x="759.9" y="624.1" width="124.4" height="50.9" fill="#111111"/><rect x="760.4" y="624.6" width="123.4" height="49.9" fill="none" stroke="#111111" stroke-width="1"/><text x="784.9" y="654.2" font-family="Arial" font-size="14" font-weight="normal" fill="#ffffff" xml:space="preserve">Записаться</text><text x="759.9" y="703.4" font-family="Arial" font-size="12" font-weight="normal" fill="#555555" xml:space="preserve">Для проверки сценария используйте вымышленные данные.</text><text x="759.9" y="754.3" font-family="Arial" font-size="13" font-weight="normal" fill="#000000" xml:space="preserve">Изменить услугу или время</text><line x1="759.9" y1="757.3" x2="927.0" y2="757.3" stroke="#000000" stroke-width="1"/></g><g id="footer"><rect x="0.0" y="908.2" width="1440.0" height="298.1" fill="#f3f3f3"/><g id="footer-top"><text x="86.4" y="997.5" font-family="Arial" font-size="34" font-weight="bold" letter-spacing="-2" fill="#111111" xml:space="preserve">swissflex</text><text x="86.4" y="1020.2" font-family="Arial" font-size="11" font-weight="normal" fill="#111111" xml:space="preserve">Москва</text><text x="564.1" y="98