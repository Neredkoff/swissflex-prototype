"1093.0" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Обслуживание и гарантия</text><line x1="756.1" y1="1096.0" x2="901.8" y2="1096.0" stroke="#111111" stroke-width="1"/><text x="924.8" y="1093.0" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Документы</text><line x1="924.8" y1="1096.0" x2="986.7" y2="1096.0" stroke="#111111" stroke-width="1"/><text x="1009.7" y="1093.0" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Личный кабинет</text><line x1="1009.7" y1="1096.0" x2="1100.0" y2="1096.0" stroke="#111111" stroke-width="1"/></g><g id="fineprint"><line x1="86.4" y1="1143.8" x2="1353.6" y2="1143.8" stroke="#cccccc" stroke-width="1"/><text x="86.4" y="1176.3" font-family="Arial" font-size="11" font-weight="normal" fill="#777777" xml:space="preserve">Swissflex Москва, 2026. Официальный дистрибьютор Swissflex.</text><text x="1102.8" y="1176.3" font-family="Arial" font-size="11" font-weight="normal" fill="#777777" xml:space="preserve">Прототип для согласования структуры и текстов.</text></g></g></g></svg>