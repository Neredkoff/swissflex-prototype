<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="2466" viewBox="0 0 1440 2466"><rect width="1440" height="2466" fill="#ffffff"/><g id="body"><rect x="0.0" y="0.0" width="1440.0" height="2466.0" fill="#ffffff"/><g id="header"><rect x="0.0" y="0.0" width="1440.0" height="94.0" fill="#ffffff" fill-opacity="0.96"/><line x1="0.0" y1="93.5" x2="1440.0" y2="93.5" stroke="#dedede" stroke-width="1"/><g id="logo"><text x="57.6" y="48.8" font-family="Arial" font-size="34" font-weight="bold" letter-spacing="-2" fill="#111111" xml:space="preserve">swissflex</text><text x="57.6" y="71.5" font-family="Arial" font-size="11" font-weight="normal" fill="#111111" xml:space="preserve">Москва</text></g><g id="nav"><text x="629.9" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Каталог</text><text x="701.2" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Конструктор</text><text x="799.3" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Проверка зрения</text><text x="927.1" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Персонализация</text><text x="1053.0" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">О бренде</text><line x1="1053.0" y1="53.6" x2="1110.6" y2="53.6" stroke="#111111" stroke-width="1"/><text x="1134.6" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Ателье</text><text x="1201.2" y="50.6" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" xml:space="preserve">Кабинет</text></g><g id="button"><rect x="1280.6" y="26.4" width="101.8" height="40.2" fill="#111111"/><rect x="1281.1" y="26.9" width="100.8" height="39.2" fill="none" stroke="#111111" stroke-width="1"/><text x="1299.6" y="50.8" font-family="Arial" font-size="12" font-weight="normal" fill="#ffffff" xml:space="preserve">Записаться</text></g></g><g id="app"><g id="container"><text x="86.4" y="107.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">Главная</text><text x="147.1" y="107.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">/</text><text x="165.4" y="107.4" font-family="Arial" font-size="12" font-weight="normal" fill="#666666" xml:space="preserve">О бренде</text><text x="86.4" y="271.5" font-family="Arial" font-size="60.48" font-weight="normal" letter-spacing="-2" fill="#111111" xml:space="preserve">Швейцарская оправа</text><text x="86.4" y="336.3" font-family="Arial" font-size="60.48" font-weight="normal" letter-spacing="-2" fill="#111111" xml:space="preserve">от 1,8 г</text><text x="86.4" y="393.4" font-family="Arial" font-size="19" font-weight="normal" fill="#555555" xml:space="preserve">В московском ателье мы представляем Swissflex как официальный</text><text x="86.4" y="422.8" font-family="Arial" font-size="19" font-weight="normal" fill="#555555" xml:space="preserve">дистрибьютор. Подбираем оправу, проверяем зрение и собираем</text><text x="86.4" y="452.3" font-family="Arial" font-size="19" font-weight="normal" fill="#555555" xml:space="preserve">индивидуальный заказ.</text><rect x="86.4" y="545.3" width="598.6" height="400.0" fill="#f0f0f0"/><g id="Схема очков"><svg viewBox="0 0 520 310" x="86.4" y="566.9" width="598.6" height="356.9"><g transform=""><g fill="none" stroke="#4a4a4a" stroke-width="5" stroke-linecap="round"><path d="M87 133 L37 56 Q31 44 22 51"/><path d="M429 133 L475 57 Q481 45 491 51"/><path d="M231 149 Q257 131 282 149"/><path d="M90 145H75 M423 145H439"/></g><g fill="#ffffff88" stroke="#4a4a4a" stroke-width="2"><ellipse cx="160" cy="161" rx="78" ry="53"/><ellipse cx="354" cy="161" rx="78" ry="53"/></g><g fill="none" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"><path d="M241 156 L236 181 M274 156 L279 181"/></g></g></svg></g><text x="755.0" y="652.4" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">За что вы платите</text><text x="755.0" y="706.4" font-family="Arial" font-size="16" font-weight="normal" fill="#111111" xml:space="preserve">В цене оправы учитываются материал, точность изготовления деталей и</text><text x="755.0" y="731.2" font-family="Arial" font-size="16" font-weight="normal" fill="#111111" xml:space="preserve">модульная конструкция. Носоупоры, заушники и крепления линз подбираются</text><text x="755.0" y="756.0" font-family="Arial" font-size="16" font-weight="normal" fill="#111111" xml:space="preserve">по отдельности.</text><text x="755.0" y="800.8" font-family="Arial" font-size="16" font-weight="normal" fill="#111111" xml:space="preserve">Поэтому при выборе важно примерить оправу и оценить, как она держится на</text><text x="755.0" y="825.6" font-family="Arial" font-size="16" font-weight="normal" fill="#111111" xml:space="preserve">лице. В ателье покажем детали и объясним, какие изменения доступны в</text><text x="755.0" y="850.4" font-family="Arial" font-size="16" font-weight="normal" fill="#111111" xml:space="preserve">вашей модели.</text><line x1="86.4" y1="1015.8" x2="1353.6" y2="1015.8" stroke="#dddddd" stroke-width="1"/><text x="86.4" y="1116.0" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">Медицинский полимер</text><text x="608.2" y="1093.6" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Swissflex использует медицинский полимер. Из этого материала производитель делает</text><text x="608.2" y="1118.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">лёгкие и гибкие детали оправы, которые контактируют с кожей. По данным Swissflex,</text><text x="608.2" y="1143.2" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">полимер гипоаллергенный.</text><text x="608.2" y="1188.0" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Вес оправ начинается от 1,8 г без линз. Готовые очки будут тяжелее: итог зависит от</text><text x="608.2" y="1212.8" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">рецепта, формы и выбранных линз.</text><text x="608.2" y="1257.6" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Если кожа чувствительна к материалам, расскажите об этом консультанту. На примерке</text><text x="608.2" y="1282.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">можно рассмотреть точки контакта и доступные варианты деталей.</text><line x1="86.4" y1="1370.4" x2="1353.6" y2="1370.4" stroke="#dddddd" stroke-width="1"/><text x="86.4" y="1470.6" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">Конструкция из деталей</text><text x="608.2" y="1448.2" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Размер и форму носоупора, длину заушников и наконечники подбираем под посадку.</text><text x="608.2" y="1473.0" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Цвета отдельных элементов можно сочетать, если выбранная модель поддерживает</text><text x="608.2" y="1497.8" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">такое исполнение.</text><text x="608.2" y="1542.6" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Модульность помогает и при обслуживании. После осмотра мастер определит, какую</text><text x="608.2" y="1567.4" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">деталь можно заменить и получится ли сохранить линзы.</text><line x1="86.4" y1="1655.4" x2="1353.6" y2="1655.4" stroke="#dddddd" stroke-width="1"/><text x="86.4" y="1755.6" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">Московское ателье</text><text x="608.2" y="1733.2" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Покупку оформляем после очной примерки. За один визит можно выбрать оправу,</text><text x="608.2" y="1758.0" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">проверить зрение и согласовать линзы.</text><text x="608.2" y="1802.8" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Когда заказ будет готов, согласуем получение очков. Солнцезащитную пару с витрины</text><text x="608.2" y="1827.6" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">можно забрать в день посещения.</text><text x="608.2" y="1872.4" font-family="Arial" font-size="16" font-weight="normal" fill="#111111" xml:space="preserve">Подготовиться к визиту</text><line x1="608.2" y1="1875.4" x2="782.5" y2="1875.4" stroke="#111111" stroke-width="1"/></g><g id="cta"><line x1="0.0" y1="1940.4" x2="1440.0" y2="1940.4" stroke="#cccccc" stroke-width="1"/><line x1="0.0" y1="2167.3" x2="1440.0" y2="2167.3" stroke="#cccccc" stroke-width="1"/><text x="86.4" y="2035.5" font-family="Arial" font-size="43.2" font-weight="normal" letter-spacing="-1.5" fill="#111111" xml:space="preserve">Примерьте Swissflex в ателье</text><text x="86.4" y="2079.5" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">Подберём посадку, покажем цвета и обсудим линзы. Зрение можно</text><text x="86.4" y="2104.3" font-family="Arial" font-size="16" font-weight="normal" fill="#555555" xml:space="preserve">проверить на том же визите, бесплатно.</text><rect x="1155.7" y="2028.4" width="197.9" height="50.9" fill="#111111"/><rect x="1156.2" y="2028.9" width="196.9" height="49.9" fill="none" stroke="#111111" stroke-width="1"/><text x="1180.7" y="2058.5" font-family="Arial" font-size="14" font-weight="normal" fill="#ffffff" xml:space="preserve">Выбрать время визита</text></g></g><g id="footer"><rect x="0.0" y="2167.8" width="1440.0" height="298.1" fill="#f3f3f3"/><g id="footer-top"><text x="86.4" y="2257.2" font-family="Arial" font-size="34" font-weight="bold" letter-spacing="-2" fill="#111111" xml:space="preserve">swissflex</text><text x="86.4" y="2279.8" font-family="Arial" font-size="11" font-weight="normal" fill="#111111" xml:space="preserve">Москва</text><text x="564.1" y="2244.8" font-family="Arial" font-size="15" font-weight="normal" fill="#555555" xml:space="preserve">Швейцарские очки.</text><text x="564.1" y="2268.0" font-family="Arial" font-size="15" font-weight="normal" fill="#555555" xml:space="preserve">Индивидуальный подбор в Москве.</text><rect x="1155.7" y="2227.8" width="197.9" height="50.9" fill="#111111"/><rect x="1156.2" y="2228.3" width="196.9" height="49.9" fill="none" stroke="#111111" stroke-width="1"/><text x="1180.7" y="2257.9" font-family="Arial" font-size="14" font-weight="normal" fill="#ffffff" xml:space="preserve">Выбрать время визита</text></g><g id="footer-links"><text x="86.4" y="2352.7" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Каталог</text><line x1="86.4" y1="2355.7" x2="130.0" y2="2355.7" stroke="#111111" stroke-width="1"/><text x="153.0" y="2352.7" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Проверка зрения</text><line x1="153.0" y1="2355.7" x2="248.8" y2="2355.7" stroke="#111111" stroke-width="1"/><text x="271.8" y="2352.7" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Персонализация</text><line x1="271.8" y1="2355.7" x2="365.8" y2="2355.7" stroke="#111111" stroke-width="1"/><text x="388.8" y="2352.7" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Конструктор</text><line x1="388.8" y1="2355.7" x2="457.3" y2="2355.7" stroke="#111111" stroke-width="1"/><text x="480.3" y="2352.7" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">О бренде и материале</text><line x1="480.3" y1="2355.7" x2="607.2" y2="2355.7" stroke="#111111" stroke-width="1"/><text x="630.2" y="2352.7" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Ателье и контакты</text><line x1="630.2" y1="2355.7" x2="733.1" y2="2355.7" stroke="#111111" stroke-width="1"/><text x="756.1" y="2352.7" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Обслуживание и гарантия</text><line x1="756.1" y1="2355.7" x2="901.8" y2="2355.7" stroke="#111111" stroke-width="1"/><text x="924.8" y="2352.7" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Документы</text><line x1="924.8" y1="2355.7" x2="986.7" y2="2355.7" stroke="#111111" stroke-width="1"/><text x="1009.7" y="2352.7" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" xml:space="preserve">Личный кабинет</text><line x1="1009.7" y1="2355.7" x2="1100.0" y2="2355.7" stroke="#111111" stroke-width="1"/></g><g id="fineprint"><line x1="86.4" y1="2403.4" x2="1353.6" y2="2403.4" stroke="#cccccc" stroke-width="1"/><text x="86.4" y="2435.9" font-family="Arial" font-size="11" font-weight="normal" fill="#777777" xml:space="preserve">Swissflex Москва, 2026. Официальный дистрибьютор Swissflex.</text><text x="1102.8" y="2435.9" font-family="Arial" font-size="11" font-weight="normal" fill="#777777" xml:space="preserve">Прототип для согласования структуры и текстов.</text></g></g></g></svg>